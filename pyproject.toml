[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-pilot"
version = "0.1.0"
description = "A reproducible Reinforcement Learning pipeline training a PPO agent for autonomous lunar landings in Gymnasium LunarLander-v3."
authors = [{ name = "LunarPilot Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium[box2d]>=0.29.1",
    "stable-baselines3[extra]>=2.2.1",
    "numpy>=1.24.0,<2.0.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "tensorboard>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
